[project]
name = "bambu-mcp"
version = "0.1.0"
description = "Local MCP server for Bambu Lab printers (status, AMS spools, slice, print with confirm)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "mcp>=2.3,<3",
    "paho-mqtt>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bambu-mcp = "bambu_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bambu_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
